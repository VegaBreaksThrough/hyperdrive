name: Deploy HyperDrive to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notes
        uses: actions/checkout@v4
        with:
          path: notes
          fetch-depth: 0

      - name: Checkout Quartz Engine
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Quartz Site
        run: |
          cd quartz
          npm ci
          
          # Inject custom Quartz configuration
          [ -f ../notes/quartz.config.ts ] && cp ../notes/quartz.config.ts quartz.config.ts
          [ -f ../notes/quartz.layout.ts ] && cp ../notes/quartz.layout.ts quartz.layout.ts
          [ -f ../notes/custom.scss ] && cp ../notes/custom.scss quartz/styles/custom.scss
          
          # Clean and populate content
          rm -rf content/*
          cp -r ../notes/* content/
          rm -rf content/quartz content/notes content/.git content/.github content/quartz.config.ts content/quartz.layout.ts content/custom.scss
          
          # Build with expanded memory for large vault
          NODE_OPTIONS="--max-old-space-size=8192" npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
